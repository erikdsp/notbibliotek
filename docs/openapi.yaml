openapi: 3.0.0
info:
  title: notbibliotek API
  version: 1.0.1
  description: organize sheet music for an orchestra
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
tags:
  - name: Songs
    description: Songs in the library
  - name: Song Versions
    description: Song versions and related file operations
  - name: Scores
    description: Score and score file operations
  - name: Parts
    description: Part and part file operations
  - name: Instruments
    description: Instruments in the library
  - name: Concerts
    description: Concerts and their songs
paths:
  /songs:
    get:
      tags: 
        - Songs
      summary: Get songs
      description: Returns songs in the library.
      operationId: get-songs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Song'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          schema:
            type: string
      security:
        - libraryAccess: []
    post:
      tags: 
        - Songs
      summary: Post song
      description: Post a song to the library
      operationId: post-song
      responses:
        '201':
          description: Song created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSongRequest'
      security:
        - adminAuth: []
  /songs/{song_id}:
    get:
      tags: 
        - Songs
      summary: Get song by ID
      description: Returns songs in the library.
      operationId: get-song-by-id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - libraryAccess: []
    patch:
      tags: 
        - Songs
      summary: Patch song
      operationId: patch-song
      responses:
        '200':
          description: Song updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Song not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSongRequest'
      security:
        - adminAuth: []
  /songs/{song_id}/versions:
    post:
      tags: 
        - Song Versions
      summary: Create a new song version draft
      description: Create a new song version draft
      operationId: post-song-version
      responses:
        '201':
          description: Version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongVersion'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - adminAuth: []
  /songs/{song_id}/versions/{version_id}/score:
    post:
      tags:
        - Song Versions
      summary: Post score version
      operationId: post-score-version
      responses:
        '201':
          description: Score version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreVersion'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Song not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
        - name: version_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadScoreVersionRequest'
      security:
        - adminAuth: []
  /songs/{song_id}/parts:
    post:
      tags:
        - Song Versions
      summary: Create a new part for a song
      operationId: post-part
      responses:
        '201':
          description: Song part created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartRequest'
      security:
        - adminAuth: []
  /songs/{song_id}/versions/{version_id}/parts/{part_id}:
    post:
      tags:
        - Song Versions
      summary: Post part version
      operationId: post-part-version
      responses:
        '201':
          description: Part version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartVersion'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Song not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
        - name: version_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
        - name: part_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadPartVersionRequest'
      security:
        - adminAuth: []
  /songs/{song_id}/versions/{version_id}/publish:
    post:
      tags:
        - Song Versions
      summary: Publish song version
      operationId: publish-song-version
      responses:
        '200':
          description: Song version published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongVersion'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
        - name: version_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - adminAuth: []
  /songs/{song_id}/score/file:
    get:
      tags:
        - Scores
      summary: Get score file (old API)
      description: Get score file. From old API version, might change 
      operationId: get-score-file
      responses:
        '200':
          description: Score file.
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/PdfContent'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Song not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - libraryAccess: []
  /songs/{song_id}/score/versions:
    get:
      tags:
        - Scores
      summary: Get score versions (old API)
      operationId: get-score-versions
      responses:
        '200':
          description: Score versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoreVersion'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Song not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - libraryAccess: []
  /parts/{part_id}/file:
    get:
      tags:
        - Parts
      summary: Get part file (old API)
      operationId: get-part-file
      responses:
        '200':
          description: Part file.
          content:
            application/pdf:
              schema:
                $ref: '#/components/schemas/PdfContent'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: part_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - libraryAccess: []
  /parts/{part_id}/instruments:
    post:
      tags:
        - Parts
      summary: Post part instrument connection
      operationId: post-part-instrument
      responses:
        '201':
          description: Part Instrument created.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Part not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: part_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartInstrumentRequest'
      security:
        - adminAuth: []
  /parts/{part_id}/instruments/{instrument_id}:
    delete:
      tags:
        - Parts
      summary: Delete part instrument connection
      operationId: delete-part-instrument
      responses:
        '200':
          description: Part instrument deleted.
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: part_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
        - name: instrument_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - adminAuth: []
  /instruments:
    get:
      tags:
        - Instruments
      summary: Get instruments
      operationId: get-instruments
      responses:
        '200':
          description: Instruments defined in the library.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instrument'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - libraryAccess: []
    post:
      tags:
        - Instruments
      summary: Post instrument
      operationId: post-instrument
      responses:
        '201':
          description: Instrument created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstrumentRequest'
      security:
        - adminAuth: []
  /instruments/{instrument_id}:
    delete:
      tags:
        - Instruments
      summary: Delete instrument
      operationId: delete-instrument
      responses:
        '200':
          description: Instrument deleted.
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Instrument not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: instrument_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - adminAuth: []        
  /concerts:
    get:
      tags:
        - Concerts
      summary: Get concerts
      operationId: get-concerts
      responses:
        '200':
          description: Concerts in library.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Concert'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - libraryAccess: []
    post:
      tags:
        - Concerts
      summary: Post concert
      operationId: post-concert
      responses:
        '201':
          description: Concert created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concert'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConcertRequest'
      security:
        - adminAuth: []
  /concerts/{concert_id}:
    get:
      tags:
        - Concerts
      summary: Get concert by id
      operationId: get-concert
      responses:
        '200':
          description: Concert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concert'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Concert not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: concert_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - libraryAccess: []
    patch:
      tags:
        - Concerts
      summary: Patch concert
      operationId: patch-concert
      responses:
        '200':
          description: Concert updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concert'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Concert not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: concert_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConcertRequest'
      security:
        - adminAuth: []
  /concerts/{concert_id}/songs:
    get:
      tags:
        - Concerts
      summary: Get concert songs
      operationId: get-concert-songs
      responses:
        '200':
          description: Concert songs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Song'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Concert not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: concert_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - libraryAccess: []
    post:
      tags:
        - Concerts
      summary: Post song to concert
      operationId: post-song-to-concert
      responses:
        '201':
          description: Song created in concert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: concert_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSongToConcertRequest'
      security:
        - adminAuth: []
  /concerts/{concert_id}/songs/{song_id}:
    delete:
      tags:
        - Concerts
      summary: Delete song from concert
      operationId: delete-song-from-concert
      responses:
        '200':
          description: Song deleted from concert.
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: concert_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - adminAuth: []
  /concerts/{concert_id}/scores:
    get:
      tags:
        - Concerts
      summary: Get concert scores
      operationId: get-concert-scores
      responses:
        '200':
          description: Concert Scores.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConcertScoreResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Concert not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: concert_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - libraryAccess: []
  /concerts/{concert_id}/parts:
    get:
      tags:
        - Concerts
      summary: Get concert parts
      operationId: get-concert-parts
      responses:
        '200':
          description: Concert parts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConcertPartResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Concert not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: instrument_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ULID"
        - name: concert_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - libraryAccess: []
components:
  schemas:
    ULID:
      type: string
      minLength: 26
      maxLength: 26
    Song:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        title:
          type: string
        archived_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - title
        - archived_at
    Score:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        song_id:
          $ref: "#/components/schemas/ULID"
      required:
        - id
        - song_id
    Part: 
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        song_id:
          $ref: "#/components/schemas/ULID"
        name:
          type: string
      required:
        - id
        - song_id
        - name
    Instrument:
      type: object
      properties: 
        id:
          $ref: "#/components/schemas/ULID"
        name:
          type: string
      required:
        - id
        - name
    SongVersion:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        song_id:
          $ref: "#/components/schemas/ULID"
        published_at:
          type: string
          format: date-time
          nullable: true          
      required:
        - id
        - song_id
        - published_at      
    PartVersion:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        song_version_id:
          $ref: "#/components/schemas/ULID"
        part_id:
          $ref: "#/components/schemas/ULID"
        file_id:
          $ref: "#/components/schemas/ULID"
      required:
        - id
        - song_version_id
        - part_id
        - file_id
    ScoreVersion:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        song_version_id:
          $ref: "#/components/schemas/ULID"
        score_id:
          $ref: "#/components/schemas/ULID"
        file_id:
          $ref: "#/components/schemas/ULID"
      required:
        - id
        - song_version_id
        - score_id
        - file_id
    File:
      type: object
      nullable: true
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        file_name:
          type: string
      required:
        - id
        - file_name
    Concert:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        name:
          type: string
        date:

openapi: 3.0.0
info:
  title: notbibliotek API
  version: 1.0.1
  description: organize sheet music for an orchestra
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
tags:
  - name: Songs
    description: Songs in the library
  - name: Downloads
    description: Download files from the library
  - name: Song Versions
    description: Song versions and handling file uploads
  - name: Instruments
    description: Instruments in the library and their connections
  - name: Concerts
    description: Concerts and their songs
paths:
  /songs:
    get:
      tags: 
        - Songs
      summary: Get songs
      description: Get songs in the library with rich version data.
      operationId: get-songs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SongResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - $ref: "#/components/parameters/archivedQuery"
        - $ref: "#/components/parameters/searchQuery"
        - $ref: "#/components/parameters/concertQuery"
        - $ref: "#/components/parameters/partQuery"
        - $ref: "#/components/parameters/instrumentQuery"
        - $ref: "#/components/parameters/includeScoreQuery"
      security:
        - libraryAccess: []
    post:
      tags: 
        - Songs
      summary: Post song
      description: Post a song to the library
      operationId: post-song
      responses:
        '201':
          description: Song created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSongRequest'
      security:
        - adminAuth: []
  /songs/{song_id}:
    get:
      tags: 
        - Songs
      summary: Get song by ID
      description: Get a song from the library with rich version data.
      operationId: get-song-by-id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
        - $ref: "#/components/parameters/partQuery"
        - $ref: "#/components/parameters/instrumentQuery"
        - $ref: "#/components/parameters/includeScoreQuery"
      security:
        - libraryAccess: []
    patch:
      tags: 
        - Songs
      summary: Patch song
      operationId: patch-song
      responses:
        '200':
          description: Song updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Song not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSongRequest'
      security:
        - adminAuth: []
  /songs/{song_id}/versions:
    post:
      tags: 
        - Song Versions
      summary: Create a new song version draft
      description: Create a new song version draft
      operationId: post-song-version
      responses:
        '201':
          description: Version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongVersion'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - adminAuth: []
  /songs/{song_id}/versions/{version_id}/score:
    post:
      tags:
        - Song Versions
      summary: Upload score
      operationId: upload-score
      responses:
        '201':
          description: Score uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Song not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
        - name: version_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadScoreRequest'
      security:
        - adminAuth: []
  /songs/{song_id}/versions/{version_id}/part:
    post:
      tags:
        - Song Versions
      summary: Upload part
      operationId: upload-part
      responses:
        '201':
          description: Part uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Song not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
        - name: version_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadPartRequest'
      security:
        - adminAuth: []
  /songs/{song_id}/versions/{version_id}/publish:
    post:
      tags:
        - Song Versions
      summary: Publish song version
      operationId: publish-song-version
      responses:
        '200':
          description: Song version published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
        - name: version_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - adminAuth: []
  /instruments:
    get:
      tags:
        - Instruments
      summary: Get instruments
      operationId: get-instruments
      responses:
        '200':
          description: Instruments defined in the library.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instrument'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - libraryAccess: []
    post:
      tags:
        - Instruments
      summary: Post instrument
      operationId: post-instrument
      responses:
        '201':
          description: Instrument created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstrumentRequest'
      security:
        - adminAuth: []
  /instruments/{instrument_id}:
    delete:
      tags:
        - Instruments
      summary: Delete instrument
      operationId: delete-instrument
      responses:
        '200':
          description: Instrument deleted.
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Instrument not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: instrument_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - adminAuth: []
  /parts/{part_id}/instruments:
    post:
      tags:
        - Instruments
      summary: Post part instrument connection
      operationId: post-part-instrument
      responses:
        '201':
          description: Part Instrument created.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Part not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: part_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartInstrumentRequest'
      security:
        - adminAuth: []
  /parts/{part_id}/instruments/{instrument_id}:
    delete:
      tags:
        - Instruments
      summary: Delete part instrument connection
      operationId: delete-part-instrument
      responses:
        '200':
          description: Part instrument deleted.
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: part_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
        - name: instrument_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - adminAuth: []
  /concerts:
    get:
      tags:
        - Concerts
      summary: Get concerts
      operationId: get-concerts
      responses:
        '200':
          description: Concerts in library and associated songs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConcertResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - libraryAccess: []
    post:
      tags:
        - Concerts
      summary: Post concert
      operationId: post-concert
      responses:
        '201':
          description: Concert created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concert'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConcertRequest'
      security:
        - adminAuth: []
  /concerts/{concert_id}:
    get:
      tags:
        - Concerts
      summary: Get concert by id
      operationId: get-concert
      responses:
        '200':
          description: Concert with songs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConcertResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Concert not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: concert_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - libraryAccess: []
    patch:
      tags:
        - Concerts
      summary: Patch concert
      operationId: patch-concert
      responses:
        '200':
          description: Concert updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concert'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Concert not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: concert_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConcertRequest'
      security:
        - adminAuth: []
  /concerts/{concert_id}/songs:
    post:
      tags:
        - Concerts
      summary: Post song to concert
      operationId: post-song-to-concert
      responses:
        '201':
          description: Song connected to concert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: concert_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSongToConcertRequest'
      security:
        - adminAuth: []
  /concerts/{concert_id}/songs/{song_id}:
    delete:
      tags:
        - Concerts
      summary: Remove song from concert
      operationId: remove-song-from-concert
      responses:
        '200':
          description: Song removed from concert.
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: concert_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
        - name: song_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ULID"
      security:
        - adminAuth: []
components:
  schemas:
    ULID:
      type: string
      minLength: 26
      maxLength: 26
    NullableULID:
      type: string
      minLength: 26
      maxLength: 26
      nullable: true
    Song:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        title:
          type: string
        archived_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - title
        - archived_at
    SongVersion:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        song_id:
          $ref: "#/components/schemas/ULID"
        published_at:
          type: string
          format: date-time
          nullable: true          
      required:
        - id
        - song_id
        - published_at      
    Score:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        song_version_id:
          $ref: "#/components/schemas/ULID"
        file_id:
          $ref: "#/components/schemas/ULID"
      required:
        - id
        - song_version_id
        - file_id
    Part: 
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        key:
          type: string
        name:
          type: string
        song_version_id:
          $ref: "#/components/schemas/ULID"
        file_id:
          $ref: "#/components/schemas/ULID"
      required:
        - id
        - key
        - name
        - song_version_id
        - file_id
    Instrument:
      type: object
      properties: 
        id:
          $ref: "#/components/schemas/ULID"
        key:
          type: string
        name:
          type: string
      required:
        - id
        - key
        - name
    File:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        name:
          type: string
      required:
        - id
        - name
    Concert:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        key:
          type: string
        name:
          type: string
        date:
          type: string
          format: date
      required:
        - id
        - key
        - name
        - date
    SongResponse:
      allOf:
        - $ref: "#/components/schemas/Song"
        - $ref: "#/components/schemas/CurrentVersionId"
        - $ref: "#/components/schemas/Versions"
    CurrentVersionId:
      type: object
      required:
        - current_version_id
      properties: 
        current_version_id:
          $ref: "#/components/schemas/NullableULID"
    Version:
      type: object
      properties: 
        song_version_id:
          $ref: "#/components/schemas/ULID"
        published_at:
          type: string
          format: date-time
          nullable: true      
        score:
          $ref: "#/components/schemas/Score"
        parts:
          type: array
          items:
            $ref: "#/components/schemas/Part"
      required:
        - song_version_id
        - published_at
        - score
        - parts
    Versions:
      type: object
      required:
        - versions
      properties: 
        versions:
          type: array
          items: 
            $ref: "#/components/schemas/Version"
    ScoreResponse:
      type: object
      properties: 
        score: 
          $ref: "#/components/schemas/Score"
        file:
          $ref: "#/components/schemas/File"
      required:
        - score
        - file
    PartResponse: 
      type: object
      properties: 
        part:
          $ref: "#/components/schemas/Part"
        file:
          $ref: "#/components/schemas/File"
      required:
        - part
        - file
    Songs:
      type: object
      nullable: true
      required:
        - songs
      properties: 
        songs:
          type: array
          items: 
            $ref: "#/components/schemas/Song"
    ConcertResponse:
      allOf:
        - $ref: "#/components/schemas/Concert"
        - $ref: "#/components/schemas/Songs"
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    CreateSongRequest:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    CreatePartInstrumentRequest:
      type: object
      properties:
        instrument_id:
          $ref: "#/components/schemas/ULID"
      required:
        - instrument_id
    CreateInstrumentRequest:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    CreateConcertRequest:
      type: object
      properties:
        name:
          type: string
        date:
          type: string
          format: date
      required:
        - name
        - date
    UpdateConcertRequest:
      type: object
      properties:
        name:
          type: string
        date:
          type: string
          format: date
    AddSongToConcertRequest:
      type: object
      properties:
        song_id:
          $ref: "#/components/schemas/ULID"
      required:
        - song_id
    UpdateSongRequest:
      type: object
      properties:
        title:
          type: string
        archived:
          type: boolean
    UploadPartRequest:
      type: object
      properties:
        name:
          type: string
        file:
          $ref: "#/components/schemas/PdfContent"
      required:
        - name
        - file
    PdfContent:
      type: string
      format: binary
    UploadScoreRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
        - file
  parameters: 
    archivedQuery:
      name: archived
      in: query
      required: false
      schema:
        type: boolean
        default: false
    searchQuery:
      name: search
      in: query
      required: false
      schema:
        type: string
    partQuery:
      name: part
      in: query
      required: false
      schema:
        type: string
    instrumentQuery:
      name: instrument
      in: query
      required: false
      schema:
        type: string
    concertQuery:
      name: concert
      in: query
      required: false
      schema:
        type: string
    includeScoreQuery:
      name: include_score
      in: query
      required: false
      schema:
        type: boolean
        default: true      
  securitySchemes:
    adminAuth:
      type: http
      description: Admin Authentication
      scheme: bearer
      bearerFormat: JWT
    libraryAccess:
      type: apiKey
      description: Link with library access
      name: access_token
      in: query
security: []
